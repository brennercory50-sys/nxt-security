# NXT-Security configuration.
# Per-machine overrides go in config/local.yaml (git-ignored).
# Environment overrides: NXTSEC_<SECTION>__<KEY>, e.g. NXTSEC_LOGGING__LEVEL=DEBUG
# Credentials are NEVER stored here. Use environment variables (see .env.example).

operator: null            # defaults to the OS username

paths:
  home: null              # data dir; null = platform default (see docs/configuration.md)
  scope_file: config/scope.yaml
  plugins_dir: plugins
  evidence_dir: null      # null = <home>/evidence

database:
  url: null               # null = sqlite:///<home>/nxtsec.db

logging:
  level: INFO             # log file level
  console: true
  console_level: WARNING  # terminal level (INFO/DEBUG for more detail)
  json: false
  file: true              # rotating JSON log in <home>/logs/

execution:
  default_timeout: 60     # seconds
  max_output_bytes: 10485760

# Explicit tool locations. Leave empty to resolve from PATH.
tools: {}
#  nmap: { path: "C:/Program Files (x86)/Nmap/nmap.exe" }

ai:
  provider: offline       # offline | claude | openai | local
  model: null             # provider default if null (claude -> claude-opus-5-5)
  base_url: null          # for local/OpenAI-compatible servers (e.g. Ollama)
  api_key_env: OPENAI_API_KEY   # NAME of the env var holding the key (never the key itself)
  # Keys come ONLY from the environment: ANTHROPIC_API_KEY for claude, the var
  # named above for openai/local. AI output is advisory and never changes a finding.

safety:
  require_attestation: true   # REAL-mode network ops need operator_attestation in the scope
  max_cidr_hosts: 4096        # largest CIDR target accepted
  max_risk_real: medium       # modules above this risk run only in LAB mode

jobs:
  workers: 2                  # in-process concurrent assessments
  poll_interval: 5            # seconds between queue checks for `nxtsec jobs worker`

scheduler:
  enabled: false

lab:
  enabled: true
  docker_network: nxtsec-lab
